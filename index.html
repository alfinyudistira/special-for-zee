<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untuk Zee 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --deep: #e75480; --dark: #7a2650; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow-x: hidden;
    font-family: 'Quicksand', sans-serif;
    color: var(--dark);
    background: linear-gradient(135deg, #ffd6eb, #ffeaf5, #ffc2e0, #ffd6eb);
    background-size: 300% 300%;
    animation: bgshift 14s ease infinite;
  }
  @keyframes bgshift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  .float {
    position: fixed; bottom: -60px; font-size: 26px; pointer-events: none;
    z-index: 0; animation: rise linear forwards;
  }
  @keyframes rise {
    from { transform: translateY(0) rotate(0deg); opacity: 1; }
    to   { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
  }

  /* Efek kilau & kelopak saat layar disentuh */
  .tap-spark {
    position: fixed; pointer-events: none; z-index: 99;
    font-size: 16px; animation: sparkPop .85s ease-out forwards;
  }
  @keyframes sparkPop {
    0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(1.15) rotate(45deg); opacity: 0; }
  }

  .screen { display: none; min-height: 100vh; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px; text-align: center; position: relative; z-index: 1; }
  .screen.active { display: flex; animation: fadeUp .6s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

  .card {
    background: rgba(255,255,255,.78); border-radius: 28px; padding: 28px 22px;
    box-shadow: 0 12px 32px rgba(231,84,128,.28); max-width: 440px; width: 100%;
  }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 30px; margin: 6px 0 10px; color: var(--deep);
  }
  .sub { font-size: 15px; opacity: .85; margin-bottom: 14px; font-weight: 500; }

  .cat { font-size: 64px; display: inline-block; animation: bob 1.4s infinite ease-in-out; }
  @keyframes bob { 50% { transform: translateY(-12px) rotate(-6deg); } }

  .pin-box {
    padding: 12px 20px; border-radius: 999px; border: 2px dashed var(--deep);
    width: 82%; min-height: 48px; margin: 0 auto 14px;
    font-size: 20px; font-weight: 700; letter-spacing: 5px;
    display: flex; align-items: center; justify-content: center;
    background: #fff; color: var(--dark); user-select: none;
  }
  .pin-placeholder {
    font-size: 14px; font-weight: 500; letter-spacing: normal; opacity: .55;
  }

  .keypad {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    max-width: 240px; margin: 0 auto 6px;
  }
  .key {
    margin-top: 0; padding: 11px 0; border-radius: 16px;
    background: #fff; color: var(--deep); font-family: 'Quicksand', sans-serif;
    font-size: 18px; font-weight: 700; border: 1.5px solid #ffc2d9;
    box-shadow: 0 4px 0 #f3b6cc; cursor: pointer;
    transition: transform .1s, box-shadow .1s;
  }
  .key:active { transform: translateY(3px); box-shadow: 0 1px 0 #f3b6cc; }
  .key-action { background: #ffeaf5; color: var(--dark); font-size: 15px; }

  button#unlock, button#next, button#restart {
    margin-top: 14px; padding: 13px 28px; border: none; border-radius: 999px;
    background: var(--deep); color: #fff; font-family: 'Quicksand', sans-serif;
    font-size: 17px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 0 #b83c64; transition: transform .1s, box-shadow .1s;
  }
  button#unlock:hover, button#next:hover, button#restart:hover { filter: brightness(1.05); }
  button#unlock:active, button#next:active, button#restart:active { transform: translateY(4px); box-shadow: 0 2px 0 #b83c64; }
  .hint { font-size: 13px; margin-top: 12px; opacity: .7; }

  #msg {
    font-size: 22px; font-weight: 600; line-height: 1.5; min-height: 120px; margin: 14px 0 4px;
    animation: pop .5s ease;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .counter { font-size: 13px; opacity: .6; }

  .museum-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 28px; font-weight: 700; color: var(--deep); margin: 4px 0;
  }
  .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
  .frame {
    background: linear-gradient(145deg, #f7dc8a, #c4953a); padding: 14px 14px 10px;
    border-radius: 6px; box-shadow: 0 10px 24px rgba(0,0,0,.28);
    transform: rotate(-2deg); transition: transform .3s;
  }
  .frame:nth-child(2) { transform: rotate(2deg); }
  .frame:hover { transform: rotate(0deg) scale(1.04); }
  .frame img { width: 160px; height: 210px; object-fit: cover; display: block; border: 4px solid #5b3a12; }
  .plaque {
    background: #fffbea; color: #5b3a12;
    font-family: 'Playfair Display', Georgia, serif; font-style: italic;
    font-size: 12.5px; margin-top: 8px; padding: 6px 6px; border-radius: 2px;
  }

  /* Efek Mawar Putih Mekar */
  .rose-stage {
    margin: 14px auto 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
  }
  .white-rose-svg {
    width: 112px; height: 112px;
    filter: drop-shadow(0 6px 14px rgba(231, 84, 128, 0.25));
    animation: roseFloat 4s ease-in-out infinite;
  }
  @keyframes roseFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-5px) scale(1.03); }
  }

  .rose-leaf, .petal-outer, .petal-mid, .petal-inner, .petal-core {
    transform-box: view-box;
    transform-origin: 100px 100px;
  }
  .rose-leaf {
    opacity: 0;
    animation: bloomLeaf 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
  }
  .petal-outer {
    opacity: 0;
    animation: bloomOuter 2.3s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
  }
  .petal-mid {
    opacity: 0;
    animation: bloomMid 2.2s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
  }
  .petal-inner {
    opacity: 0;
    animation: bloomInner 2s cubic-bezier(0.22, 1, 0.36, 1) 1.05s forwards;
  }
  .petal-core {
    opacity: 0;
    animation: bloomCore 1.6s cubic-bezier(0.22, 1, 0.36, 1) 1.35s forwards;
  }

  @keyframes bloomLeaf {
    0%   { transform: scale(0.2) rotate(-20deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes bloomOuter {
    0%   { transform: scale(0.22) rotate(-38deg); opacity: 0.15; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes bloomMid {
    0%   { transform: scale(0.2) rotate(32deg); opacity: 0.15; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes bloomInner {
    0%   { transform: scale(0.18) rotate(-26deg); opacity: 0.15; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes bloomCore {
    0%   { transform: scale(0.15) rotate(40deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
</style>
</head>
<body>

<!-- LAYAR 1: PIN -->
<section class="screen active" id="s1">
  <div class="card">
    <div class="cat">🐱</div>
    <h1>Ada yang spesial 🌷</h1>
    <p class="sub">Masukkan pin untuk membuka halaman ini.</p>
    <div class="pin-box" id="pin-display">
      <span class="pin-placeholder">tekan angka di bawah</span>
    </div>
    <div class="keypad">
      <button type="button" class="key" data-num="1">1</button>
      <button type="button" class="key" data-num="2">2</button>
      <button type="button" class="key" data-num="3">3</button>
      <button type="button" class="key" data-num="4">4</button>
      <button type="button" class="key" data-num="5">5</button>
      <button type="button" class="key" data-num="6">6</button>
      <button type="button" class="key" data-num="7">7</button>
      <button type="button" class="key" data-num="8">8</button>
      <button type="button" class="key" data-num="9">9</button>
      <button type="button" class="key key-action" id="clear-pin">C</button>
      <button type="button" class="key" data-num="0">0</button>
      <button type="button" class="key key-action" id="del-pin">⌫</button>
    </div>
    <button id="unlock">Buka 🔓</button>
    <p class="hint">Pinnya bebas kok, asal kamu coba 😉</p>
  </div>
</section>

<!-- LAYAR 2: PESAN -->
<section class="screen" id="s2">
  <div class="card">
    <div class="cat">😺</div>
    <div id="msg"></div>
    <p class="counter" id="counter"></p>
    <button id="next">Lanjut 💕</button>
  </div>
</section>

<!-- LAYAR 3: GALERI MUSEUM -->
<section class="screen" id="s3">
  <div class="card">
    <div class="museum-title">🏛️ Pameran Khusus: Zee</div>
    <p class="sub">Koleksi paling indah hari ini dan seterusnya</p>
    <div class="gallery">
      <div class="frame">
        <img src="foto1.jpeg" alt="Zee di depan Kickstart">
        <div class="plaque">zee, kamu kelihatan keren banget disini</div>
      </div>
      <div class="frame">
        <img src="foto2.jpeg" alt="Zee duduk di kafe">
        <div class="plaque">zee kamu terlihat manisss bangettt disini</div>
      </div>
    </div>

    <!-- Mawar Putih Mekar -->
    <div class="rose-stage" id="rose-stage" title="Ketuk mawarnya">
      <svg viewBox="0 0 200 200" class="white-rose-svg" id="white-rose">
        <defs>
          <radialGradient id="petalOuterGrad" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="72%" stop-color="#fcf6f8"/>
            <stop offset="100%" stop-color="#e8d4da"/>
          </radialGradient>
          <radialGradient id="petalMidGrad" cx="50%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="70%" stop-color="#fdf8fa"/>
            <stop offset="100%" stop-color="#edd9df"/>
          </radialGradient>
          <radialGradient id="petalInnerGrad" cx="50%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#fffef9"/>
            <stop offset="75%" stop-color="#f9eff2"/>
            <stop offset="100%" stop-color="#e7cdd4"/>
          </radialGradient>
          <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8ec198"/>
            <stop offset="100%" stop-color="#4e7d58"/>
          </linearGradient>
        </defs>

        <!-- Daun Hijau -->
        <g transform="rotate(35 100 100)"><path class="rose-leaf" d="M 100 100 C 84 74, 86 38, 100 14 C 114 38, 116 74, 100 100 Z" fill="url(#leafGrad)"/></g>
        <g transform="rotate(125 100 100)"><path class="rose-leaf" d="M 100 100 C 84 74, 86 38, 100 14 C 114 38, 116 74, 100 100 Z" fill="url(#leafGrad)"/></g>
        <g transform="rotate(215 100 100)"><path class="rose-leaf" d="M 100 100 C 84 74, 86 38, 100 14 C 114 38, 116 74, 100 100 Z" fill="url(#leafGrad)"/></g>
        <g transform="rotate(305 100 100)"><path class="rose-leaf" d="M 100 100 C 84 74, 86 38, 100 14 C 114 38, 116 74, 100 100 Z" fill="url(#leafGrad)"/></g>

        <!-- Kelopak Luar (6 kelopak) -->
        <g transform="rotate(0 100 100)"><path class="petal-outer" d="M 100 100 C 60 88, 54 36, 100 22 C 146 36, 140 88, 100 100 Z" fill="url(#petalOuterGrad)" stroke="#ead8de" stroke-width="0.8"/></g>
        <g transform="rotate(60 100 100)"><path class="petal-outer" d="M 100 100 C 60 88, 54 36, 100 22 C 146 36, 140 88, 100 100 Z" fill="url(#petalOuterGrad)" stroke="#ead8de" stroke-width="0.8"/></g>
        <g transform="rotate(120 100 100)"><path class="petal-outer" d="M 100 100 C 60 88, 54 36, 100 22 C 146 36, 140 88, 100 100 Z" fill="url(#petalOuterGrad)" stroke="#ead8de" stroke-width="0.8"/></g>
        <g transform="rotate(180 100 100)"><path class="petal-outer" d="M 100 100 C 60 88, 54 36, 100 22 C 146 36, 140 88, 100 100 Z" fill="url(#petalOuterGrad)" stroke="#ead8de" stroke-width="0.8"/></g>
        <g transform="rotate(240 100 100)"><path class="petal-outer" d="M 100 100 C 60 88, 54 36, 100 22 C 146 36, 140 88, 100 100 Z" fill="url(#petalOuterGrad)" stroke="#ead8de" stroke-width="0.8"/></g>
        <g transform="rotate(300 100 100)"><path class="petal-outer" d="M 100 100 C 60 88, 54 36, 100 22 C 146 36, 140 88, 100 100 Z" fill="url(#petalOuterGrad)" stroke="#ead8de" stroke-width="0.8"/></g>

        <!-- Kelopak Tengah (5 kelopak) -->
        <g transform="rotate(25 100 100)"><path class="petal-mid" d="M 100 100 C 66 90, 63 46, 100 34 C 137 46, 134 90, 100 100 Z" fill="url(#petalMidGrad)" stroke="#e7d2d9" stroke-width="0.8"/></g>
        <g transform="rotate(97 100 100)"><path class="petal-mid" d="M 100 100 C 66 90, 63 46, 100 34 C 137 46, 134 90, 100 100 Z" fill="url(#petalMidGrad)" stroke="#e7d2d9" stroke-width="0.8"/></g>
        <g transform="rotate(169 100 100)"><path class="petal-mid" d="M 100 100 C 66 90, 63 46, 100 34 C 137 46, 134 90, 100 100 Z" fill="url(#petalMidGrad)" stroke="#e7d2d9" stroke-width="0.8"/></g>
        <g transform="rotate(241 100 100)"><path class="petal-mid" d="M 100 100 C 66 90, 63 46, 100 34 C 137 46, 134 90, 100 100 Z" fill="url(#petalMidGrad)" stroke="#e7d2d9" stroke-width="0.8"/></g>
        <g transform="rotate(313 100 100)"><path class="petal-mid" d="M 100 100 C 66 90, 63 46, 100 34 C 137 46, 134 90, 100 100 Z" fill="url(#petalMidGrad)" stroke="#e7d2d9" stroke-width="0.8"/></g>

        <!-- Kelopak Dalam (5 kelopak) -->
        <g transform="rotate(55 100 100)"><path class="petal-inner" d="M 100 100 C 73 92, 72 56, 100 47 C 128 56, 127 92, 100 100 Z" fill="url(#petalInnerGrad)" stroke="#e4ccd3" stroke-width="0.8"/></g>
        <g transform="rotate(127 100 100)"><path class="petal-inner" d="M 100 100 C 73 92, 72 56, 100 47 C 128 56, 127 92, 100 100 Z" fill="url(#petalInnerGrad)" stroke="#e4ccd3" stroke-width="0.8"/></g>
        <g transform="rotate(199 100 100)"><path class="petal-inner" d="M 100 100 C 73 92, 72 56, 100 47 C 128 56, 127 92, 100 100 Z" fill="url(#petalInnerGrad)" stroke="#e4ccd3" stroke-width="0.8"/></g>
        <g transform="rotate(271 100 100)"><path class="petal-inner" d="M 100 100 C 73 92, 72 56, 100 47 C 128 56, 127 92, 100 100 Z" fill="url(#petalInnerGrad)" stroke="#e4ccd3" stroke-width="0.8"/></g>
        <g transform="rotate(343 100 100)"><path class="petal-inner" d="M 100 100 C 73 92, 72 56, 100 47 C 128 56, 127 92, 100 100 Z" fill="url(#petalInnerGrad)" stroke="#e4ccd3" stroke-width="0.8"/></g>

        <!-- Inti Kuncup Mawar -->
        <g class="petal-core">
          <circle cx="100" cy="100" r="17" fill="url(#petalInnerGrad)" stroke="#e2c7cf" stroke-width="1"/>
          <path d="M 100 90 C 108 90, 111 101, 104 106 C 97 111, 90 103, 93 95 C 96 89, 104 88, 108 93"
                fill="none" stroke="#d8b8c2" stroke-width="1.8" stroke-linecap="round"/>
        </g>
      </svg>
    </div>

    <button id="restart">Ulang dari awal 🌷</button>
  </div>
</section>

<script>
  const messages = [
    "Hai Zee 🌷 aku bikin ini khusus buat kamu, pelan-pelan aja bacanya ya.",
    "Semangat kerjanya ya, Zee! Aku yakin kamu bisa menyelesaikan semuanya dengan cantik 💪",
    "Kamu cantik banget deh, Zee. Serius, dari tadi aku mikirin itu terus ✨",
    "Semoga harinya lancar, tugasnya ringan, dan pikirannya tenang 🤍",
    "Kalau sudah waktunya makan, jangan lupa makan ya 🍱 Jangan sampai kelaparan karena keasyikan kerja.",
    "Aku mungkin belum tahu semua hal tentang kamu, tapi tiap ngobrol sama kamu, hariku jadi lebih manis 🌸",
    "Makasih ya sudah mau baca ini. Sekarang lihat galerinya, ada beberapa fotomu yang aku simpan di sini 🏛️"
  ];

  const $ = id => document.getElementById(id);
  const show = id => {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  };

  // Keypad PIN di layar
  let pinValue = '';
  function updatePinDisplay() {
    if (pinValue.length === 0) {
      $('pin-display').innerHTML = '<span class="pin-placeholder">tekan angka di bawah</span>';
    } else {
      $('pin-display').textContent = pinValue;
    }
  }

  document.querySelectorAll('.key[data-num]').forEach(btn => {
    btn.onclick = () => {
      if (pinValue.length < 12) {
        pinValue += btn.dataset.num;
        updatePinDisplay();
        floatOne('🤍');
      }
    };
  });

  $('del-pin').onclick = () => {
    pinValue = pinValue.slice(0, -1);
    updatePinDisplay();
  };

  $('clear-pin').onclick = () => {
    pinValue = '';
    updatePinDisplay();
  };

  // Ulangi animasi mawar putih mekar
  function replayRose() {
    const rose = $('white-rose');
    const clone = rose.cloneNode(true);
    rose.parentNode.replaceChild(clone, rose);
  }

  $('rose-stage').onclick = () => {
    replayRose();
    for (let i = 0; i < 8; i++) {
      setTimeout(() => floatOne(i % 2 === 0 ? '🤍' : '✨'), i * 90);
    }
  };

  // Pin: semua input diterima
  $('unlock').onclick = () => { show('s2'); index = 0; renderMsg(); burst(12); };

  // Pesan bertahap
  let index = 0;
  function renderMsg() {
    $('msg').textContent = messages[index];
    $('msg').style.animation = 'none'; void $('msg').offsetWidth; $('msg').style.animation = '';
    $('counter').textContent = `${index + 1} / ${messages.length}`;
    $('next').textContent = index === messages.length - 1 ? 'Lihat galeri 🏛️' : 'Lanjut 💕';
    burst(4);
  }
  $('next').onclick = () => {
    if (index < messages.length - 1) { index++; renderMsg(); }
    else {
      show('s3');
      replayRose();
      burst(18);
    }
  };
  $('restart').onclick = () => { index = 0; pinValue = ''; updatePinDisplay(); show('s1'); };

  // Bunga & kucing melayang
  const items = ['🌸', '🌷', '🤍', '🐱', '🐾', '💕', '🌹', '😻', '✨'];
  function floatOne(emoji) {
    const el = document.createElement('div');
    el.className = 'float';
    el.textContent = emoji;
    el.style.left = Math.random() * 96 + 'vw';
    const dur = 6 + Math.random() * 6;
    el.style.animationDuration = dur + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), dur * 1000);
  }
  function burst(n) {
    for (let i = 0; i < n; i++) setTimeout(() => floatOne(items[Math.floor(Math.random() * items.length)]), i * 120);
  }
  setInterval(() => floatOne(items[Math.floor(Math.random() * items.length)]), 1400);

  // Efek kilau & kelopak putih saat jari menyentuh layar
  const sparks = ['🤍', '✨', '🌸', '🐾'];
  document.addEventListener('pointerdown', e => {
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 'tap-spark';
      s.textContent = sparks[Math.floor(Math.random() * sparks.length)];
      s.style.left = e.clientX + 'px';
      s.style.top = e.clientY + 'px';
      const angle = (Math.PI * 2 * i) / 3 + Math.random();
      const dist = 28 + Math.random() * 24;
      s.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--ty', (Math.sin(angle) * dist - 18) + 'px');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 850);
    }
  });
</script>
</body>
</html>
